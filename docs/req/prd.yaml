scope:
  in_scope:
  - Offline analysis of one ticker per run on a single machine; US equities and US ADRs.
  - Local paper ledger and simulated execution; no brokerage connectivity.
  - Five deterministic-capable modules (evidence, budget, deliberation, risk, evaluation), one owner each.
  - A released baseline/enhancement/ablation comparison on the same frozen inputs.
  out_of_scope:
  - Live trading, brokerage accounts, real money.
  - Multi-tenant deployment, distributed queues, Kubernetes, cloud platform services.
  - Reinforcement-learning training, automatic stock screening, profit guarantees.
  - A web dashboard before every Must requirement passes.
  notes: Hong Kong tickers, a second model provider and more history windows are Could items and are tracked in
    the registry rather than promised here.
use_cases:
- id: UC-01
  title: Run one analysis and receive an auditable advisory
  actor: ST-01
  trigger: The user asks for an analysis of one ticker.
  requirement_ids:
  - FR-01
  - FR-02
  - FR-03
  - INV-02
  - INV-03
  main_flow:
  - The run declares its budget envelope and starts under the budget governor.
  - Every data item is admitted or excluded by the time policy against the as-of instant.
  - The discussion stops when its convergence condition is met, not on a round count.
  - The advisory is emitted together with an evidence pack naming source, publication time, fetch time and content
    hash.
  postcondition: The user holds a report whose claims trace to admitted data, plus a ledger of what the run spent.
- id: UC-02
  title: Refuse or degrade a run that would overspend
  actor: ST-01
  trigger: A reservation would exceed the remaining budget, or a concurrent call already holds the remainder.
  requirement_ids:
  - FR-02
  - INV-03
  - NFR-01
  main_flow:
  - The governor reserves before the call and settles after it.
  - An unknown usage keeps the reservation instead of returning it.
  - The run fails closed with an explicit reason rather than continuing unbudgeted.
  postcondition: The ledger still balances and no call was made that could not be paid for.
- id: UC-03
  title: Consume an evidence pack as a downstream module
  actor: ST-03
  trigger: A deliberation or advisory module needs the evidence behind a claim.
  requirement_ids:
  - FR-01
  - FR-03
  - INV-05
  main_flow:
  - The consumer reads the pack through the shared contract, not through producer internals.
  - A content hash that does not match the excerpt is an integrity violation, not something to repair.
  - A claim without a supported citation is rejected before it can enter a proposal.
  postcondition: No consumer needs to know how evidence was fetched, and no tampered excerpt passes.
- id: UC-04
  title: Block a proposal that fails deterministic risk control
  actor: ST-05
  trigger: An advisory proposal asks to change the paper ledger.
  requirement_ids:
  - FR-04
  - INV-01
  - INV-04
  - INV-06
  - INV-07
  main_flow:
  - The proposal is checked against the deterministic rule set.
  - A failed check returns a blocking verdict and records a security event.
  - The ledger mutation is rolled back or never applied; the model alone decides nothing.
  postcondition: The ledger holds only state that passed deterministic control, with an audit entry per attempt.
- id: UC-05
  title: Compare baseline, enhancement and ablation
  actor: ST-01
  trigger: The same frozen input set is ready for all three configurations.
  requirement_ids:
  - FR-05
  - NFR-07
  - NFR-09
  - GATE-05
  main_flow:
  - All three configurations run on identical inputs, with the comparison recorded and replayable.
  - Metrics and reports are produced from recorded run artifacts, not from memory.
  - A failing sample is reported, never dropped from the comparison.
  postcondition: The team can state what changed, by how much, and from which sample each number came.
- id: UC-06
  title: Govern the delivery
  actor: ST-02
  trigger: A deliverable or gate is claimed complete.
  requirement_ids:
  - GOV-01
  - GOV-02
  - GOV-03
  - GOV-04
  - GOV-05
  - GOV-06
  - GOV-07
  - GOV-08
  - GOV-09
  - GATE-06
  - SUB-01
  main_flow:
  - The claim is checked against the artifact, not against the intention.
  - A gate that cannot run is reported as not applicable, never as passed.
  - The submission package is checked for missing deliverables, secrets and stray binaries.
  postcondition: What is claimed complete is what exists, and the check itself is written down.
assumptions:
- id: AS-01
  assumption: Five members, one module each, each supervising its own coding agent.
  impact_if_wrong: Modules would have to be merged and the registry's ownership fields become wrong.
- id: AS-02
  assumption: One machine, one user, sequential runs.
  impact_if_wrong: Budget reservations and audit serialisation would need a shared store, which is out of scope.
- id: AS-03
  assumption: Model configurations must support token counting and output limits; a model without a reliable upper
    bound does not enter a hard-budget configuration.
  impact_if_wrong: The budget requirement becomes unenforceable and must be renegotiated, not quietly dropped.
- id: AS-04
  assumption: The upstream fork is pinned by SHA and its tests pass at the baseline.
  impact_if_wrong: Every comparison result becomes non-reproducible.
- id: AS-05
  assumption: A local simulated ledger satisfies the course requirement; no real trading is required.
  impact_if_wrong: A brokerage adapter would need its own threat model and acceptance scope.
constraints:
  runtime: Python 3.11+ with one tested version pinned, upstream LangGraph, Pydantic, SQLite, YAML/JSON Schema,
    pytest, Ruff, mypy, GitHub Actions.
  execution_model: 'Human-supervised agent work: no unsupervised runs, and no direct human edits of agent-generated
    code.'
  data: Core demonstration uses sources reachable without a paid live feed; a data gap is reported, never invented.
  provenance: Upstream license, commit SHA and diff are recorded in docs/baseline.md and kept in every submission.
prioritisation:
  rule: MoSCoW, recorded per entry as the priority field of requirements.yaml.
  must: The five functional requirements, every non-functional requirement except NFR-02, all governance deliverables,
    the annotated sessions, the six gates, branch protection and the comparison video.
  should: NFR-02's optional optimisation target and wider model-stability experiments.
  could: A compact web report, a second model provider, a Hong Kong ticker sample, more history windows.
  wont: Live trading, reinforcement-learning training, automatic stock screening, multi-tenancy, Kubernetes, any
    profit guarantee.
  tradeoff_order: Deterministic safety and auditability > quality > cost > latency > interface.
