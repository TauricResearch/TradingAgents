traceability:
  registry: docs/req/requirements.yaml
  schema: docs/req/req-schema.json
  traces:
  - docs/req/trace-FR-01-evidence.md
  - docs/req/trace-FR-05-contracts.md
  - docs/req/trace-E2-evaluation.md
  approval_records: docs/approvals/
  note: A requirement is traced when its id resolves to a component, a verification and at least one artifact in
    the registry; this file deliberately does not duplicate that mapping.
glossary:
  evidence_pack: The per-claim bundle of source, publication time, fetch time, content hash and citations.
  as_of: The instant the analysis pretends to know the world; nothing published later may be admitted.
  budget_governor: The pre-call reservation layer that owns the right to spend.
  paper_ledger: The local simulated account, mutable only through deterministic risk control.
  gate: A blocking check that must pass; a gate that cannot run is not applicable, not passed.
  moscow: Must / Should / Could / Won't, the per-requirement prioritisation scale.
