# PRD — Evidence-Governed TradingAgents (EGTA)
# D1 deliverable, owner A. Machine-readable, and deliberately reference-only:
# every acceptance number lives in docs/req/requirements.yaml and is cited here by id.
# Sources: CS5351-2026-2027-project.pdf D1; execution_plan_261111.md §1, §3.4, §3.5.

schema_version: '1.0'
document: prd
owner: A
status: draft_for_review
source_of_truth: docs/req/requirements.yaml
product:
  name: Evidence-Governed TradingAgents
  abbreviation: EGTA
  baseline: TradingAgents (TauricResearch); the pinned upstream SHA is recorded in docs/baseline.md
  one_liner: A stock-analysis system whose recommendations are traceable to evidence, bounded by a hard per-run
    budget, gated by deterministic risk rules, and whose enhancement can be verified against the baseline on the
    same inputs.
  platform: single machine, single user, one ticker per run, local paper ledger only
problem:
  research_question: Can requirement formalisation, architectural authority boundaries and executable governance
    keep the evidence quality of a trading advisory while cutting redundant reasoning, and stop unsupported or rule-violating
    advisories from reaching simulated execution?
  gaps_in_baseline:
  - id: GAP-01
    description: The baseline has no cross-module evidence contract, so a recommendation cannot be traced to a specific
      source, timestamp and content hash.
    addressed_by:
    - FR-01
    - INV-02
  - id: GAP-02
    description: Existing configuration limits tokens per call but not the cumulative cost of a run, and SDK retries
      can spend budget twice.
    addressed_by:
    - FR-02
    - INV-03
    - NFR-01
  - id: GAP-03
    description: The multi-agent discussion stops on a round count, not on a testable condition, so it cannot be
      shown to converge.
    addressed_by:
    - FR-03
    - NFR-06
  - id: GAP-04
    description: Nothing between an advisory and the paper ledger is deterministic; an unapproved proposal can still
      mutate state.
    addressed_by:
    - FR-04
    - INV-01
    - INV-04
    - INV-06
    - INV-07
  - id: GAP-05
    description: 'No course-level governance surrounds the enhancement itself: no approval records, no gates, no
      reproducible comparison.'
    addressed_by:
    - FR-05
    - GOV-01
    - GOV-02
    - GOV-03
    - GOV-04
    - GATE-01
    - GATE-02
    - GATE-03
    - GATE-04
    - GATE-05
    - GATE-06
