objectives:
- id: G1
  goal: Every conclusion can be traced to concrete data, with time filtering that cannot peek past the as-of instant.
  requirement_ids:
  - FR-01
  - INV-02
  - NFR-10
- id: G2
  goal: A run cannot exceed its budget envelope, and an unknown usage is not refunded optimistically.
  requirement_ids:
  - FR-02
  - INV-03
  - NFR-01
- id: G3
  goal: Discussion terminates on a checkable condition rather than a fixed round count.
  requirement_ids:
  - FR-03
  - NFR-06
- id: G4
  goal: No proposal reaches the paper ledger without passing deterministic risk control and the audit trail.
  requirement_ids:
  - FR-04
  - INV-01
  - INV-04
  - INV-06
  - INV-07
- id: G5
  goal: Baseline, enhancement and ablation are compared on identical inputs, and the comparison is reproducible.
  requirement_ids:
