# Requirement registry (D1) — single source of truth for requirement facts.
# prd.yaml references these ids rather than restating them.
# Entries with status: draft_from_plan are faithful transcriptions of
# /home/lenovo/refs/execution_plan_261111.md and are NOT yet confirmed by their
# owners. A assembles the registry but does not define other members' acceptance
# criteria. FR-01, INV-02 and NFR-10 are confirmed by their owner A.
# This file is (to be) validated by docs/req/req-schema.json (not written yet).

schema_version: "1.0"
requirements:
  - id: FR-01
    type: functional
    statement: "Evidence Pack: every analysis output carries an evidence pack with source, publication time, fetch time, content hash and claim references, so a user can trace key conclusions to concrete data rather than only reading narrative."
    priority: Must
    source: ["§3.2 FR table", "INV-02"]
    tradeoff: null
    owner: A
    component: evidence
    fit_criterion:
      metric: evidence_field_and_citation_completeness_rate
      operator: "gte"
      threshold: 100
      unit: percent
      verification: "pytest test/offline/evidence -m \"not integration\", including the FR-01 pack test PR that asserts evidence-field and citation completeness on the 30 fixed data scenarios and the admission rule published_at <= as_of (this spec PR asserts the INV-02 time policy only)"
    evidence: ["E-01..E-31", "test_time_policy.py", "docs/req/trace-FR-01-evidence.md", "docs/approvals/test-hash-FR-01-evidence.txt"]
    status: confirmed_by_owner
    supplied_by: "A"

  - id: FR-02
    type: functional
    statement: "Budgeted Run: after a user selects a budget, the system performs global resource admission before any call, and when resources are insufficient it stops or degrades and outputs the reason and consumption."
    priority: Must
    source: ["§3.2 FR table", "INV-03"]
    tradeoff: null
    owner: B
    component: budget
    fit_criterion:
      metric: calls_executed_without_prior_reserve
      operator: "eq"
      threshold: 0
      unit: count
      verification: "fake provider: every call (including parallel, retry, compression) is reserved before execution; new calls when budget is insufficient = 0; negative cases cover concurrent budget contention, retry-after-timeout and unknown pricing config"
    evidence: ["T-BUD-01", "T-BUD-02", "reserved/actual/unknown_usage", "budget_denied"]
    status: draft_from_plan
    supplied_by: "B"

  - id: FR-03
    type: functional
    statement: "Structured Deliberation: convert free discussion into a stateful protocol of independent proposals -> merge/dedupe -> evidence evaluation -> counterargument challenge -> summary, showing supporting/opposing grounds and unresolved conflicts."
    priority: Must
    source: ["§3.2 FR table", "INV-05"]
    tradeoff: null
    owner: C
    component: deliberation
    fit_criterion:
      metric: fixtures_obeying_phase_transitions
      operator: "eq"
      threshold: 30
      unit: count
      verification: "30 discussion fixtures all obey phase transitions; each round's proposal holds claim/evidence/counterargument fields; at most 2 challenge rounds, and a repeat round with no new evidence stops early; negative cases cover skipped phases, unsupported proposals and injected instructions"
    evidence: ["T-DEL-01", "EVAL-QUALITY-01", "phase_transition", "unsupported_claim_rate"]
    status: draft_from_plan
    supplied_by: "C"

  - id: FR-04
    type: functional
    statement: "Deterministic Risk Gate + Paper Ledger: after a user sets a paper account and limits, an LLM suggestion forms a paper order only after passing deterministic checks, and every rejection reason is shown."
    priority: Must
    source: ["§3.2 FR table", "INV-01", "INV-04", "INV-06"]
    tradeoff: null
    owner: D
    component: risk_gate
    fit_criterion:
      metric: illegal_suggestions_executed
      operator: "eq"
      threshold: 0
      unit: count
      verification: "of 100 risk/boundary cases the number of illegally executed suggestions is 0; resubmitting the same proposal is booked only once; safety rules cannot be changed by prompt or model output; negative cases cover negative quantity, insufficient funds, over position, expired approval and audit-write failure"
    evidence: ["T-RISK-01", "T-RISK-02", "T-RISK-03", "blocked_by_rule", "duplicate_prevented", "ledger_commit"]
    status: draft_from_plan
    supplied_by: "D"

  - id: FR-05
    type: functional
    statement: "Comparison & Audit Report: for the same case, compare the baseline, the enhanced version and ablations, showing quality, token, cost, latency and risk blocking; replay structured events and trace them to requirements and tests."
    priority: Must
    source: ["§3.2 FR table", "NFR-08", "NFR-09"]
    tradeoff: null
    owner: E
    component: evaluation
    fit_criterion:
      metric: fixed_scenarios_producing_paired_reports
      operator: "eq"
      threshold: 30
      unit: count
      verification: "30 fixed scenarios can generate paired reports; a missing comparison result is explicitly shown as incomplete and not counted as a win; replay verifies hash and schema and retains the same terminal state; negative cases cover tampered logs, mixed comparison across data snapshots and missing usage"
    evidence: ["T-EVAL-01", "T-EVAL-02", "incomplete_pairs", "event_gap", "manifest_mismatch"]
    status: draft_from_plan
    supplied_by: "E"

  - id: NFR-01
    type: nonfunctional
    statement: "Each run is subject to the triple constraints max_total_tokens, max_cost_usd and max_calls; the default candidate is 80,000 tokens, 2 USD and 24 calls; it is configurable but must be frozen into the run record; no over-budget admission."
    priority: Must
    source: ["§3.3 NFR table", "FR-02"]
    tradeoff: null
    owner: B
    component: budget
    fit_criterion:
      metric: max_total_tokens
      operator: "lte"
      threshold: 80000
      unit: tokens
      verification: "atomic-reserve stress test; actual usage and estimate reported separately (default candidate also 2 USD max_cost_usd and 24 max_calls, configurable and frozen to the run record)"
    evidence: ["reserved/actual/unknown_usage", "budget_denied"]
    status: draft_from_plan
    supplied_by: "B"

  - id: NFR-02
    type: nonfunctional
    statement: "Under the same model, input and analyst roles, the enhanced version's cumulative token median drops >=25% relative to the baseline and end-to-end latency median drops >=20%, while quality still satisfies NFR-03."
    priority: Should
    source: ["§3.3 NFR table", "NFR-03"]
    tradeoff: "If cost reduction and quality cannot both be achieved, keep quality and honestly report the unmet performance target; do not delete failing samples."
    owner: "B+E"
    component: evaluation
    fit_criterion:
      metric: token_median_reduction
      operator: "gte"
      threshold: 25
      unit: percent
      verification: "paired experiment of 30 scenarios x 3 runs per config, reporting p50/p95 and distributions (latency median reduction >=20%)"
    evidence: ["p50/p95", "token", "latency"]
    status: draft_from_plan
    supplied_by: "B+E"

  - id: NFR-03
    type: nonfunctional
    statement: "Human scoring of core-claim evidence entailment is >=90%, the proportion of valid citation ids is 100%, and the support rate drops by no more than 5 percentage points relative to the baseline."
    priority: Must
    source: ["§3.3 NFR table", "FR-03"]
    tradeoff: null
    owner: "C+E"
    component: deliberation
    fit_criterion:
      metric: evidence_entailment_rate
      operator: "gte"
      threshold: 90
      unit: percent
      verification: "pre-annotated set, two-person independent blind scoring plus dispute adjudication (valid citation id ratio 100%; support rate drop <=5 percentage points)"
    evidence: ["EVAL-QUALITY-01", "unsupported_claim_rate"]
    status: draft_from_plan
    supplied_by: "C+E"

  - id: NFR-04
    type: nonfunctional
    statement: "Across 100 timeout, 429, crash and restart injections there are no duplicate paper orders; recovery does not reuse version-incompatible state; each tool call times out at 30 s, each LLM call at 90 s, and a single run deadline is 300 s."
    priority: Must
    source: ["§3.3 NFR table", "FR-04"]
    tradeoff: null
    owner: "B+D"
    component: budget
    fit_criterion:
      metric: duplicate_paper_orders
      operator: "eq"
      threshold: 0
      unit: count
      verification: "fake clock + restart tests; after timeout output BLOCKED/INCOMPLETE without masking the failure (tool timeout 30 s, LLM timeout 90 s, run deadline 300 s)"
    evidence: ["T-RISK-02", "duplicate_prevented"]
    status: draft_from_plan
    supplied_by: "B+D"

  - id: NFR-05
    type: nonfunctional
    statement: "The fixed security set has at least 50 cases, with 0 successful unauthorized tool/path accesses, 0 positive secret-scan findings, and 0 injection-induced safety escapes in executable proposals."
    priority: Must
    source: ["§3.3 NFR table", "INV-05", "INV-07"]
    tradeoff: null
    owner: D
    component: risk_gate
    fit_criterion:
      metric: unauthorized_access_successes
      operator: "eq"
      threshold: 0
      unit: count
      verification: "permission-denial tests, malicious evidence set, and scan report (security set >=50 cases; secret-scan positives 0; injection-induced safety escapes 0)"
    evidence: ["permission-denial", "malicious evidence set", "scan report"]
    status: draft_from_plan
    supplied_by: "D"

  - id: NFR-06
    type: nonfunctional
    statement: "New code has 0 cross-module import violations, the five modules' public contracts pass at 100%, new business-code line coverage is >=85%, and safety-rule branch coverage is 100%."
    priority: Must
    source: ["§3.3 NFR table", "GATE-02"]
    tradeoff: "Coverage does not replace negative tests."
    owner: E
    component: evaluation
    fit_criterion:
      metric: new_business_line_coverage
      operator: "gte"
      threshold: 85
      unit: percent
      verification: "static architecture checks, contract tests, coverage (safety-rule branch coverage 100%; cross-module import violations 0; public contract pass rate 100%), per module owner"
    evidence: ["check_architecture", "contract tests", "coverage"]
    status: draft_from_plan
    supplied_by: "E"

  - id: NFR-07
    type: nonfunctional
    statement: "100% of code/prompt changes have approved tests, a corresponding AI-use log and session evidence; every feature has at least one negative test reviewed by a non-implementer."
    priority: Must
    source: ["§3.3 NFR table", "GATE-06"]
    tradeoff: null
    owner: "E+D"
    component: governance
    fit_criterion:
      metric: governed_change_rate
      operator: "gte"
      threshold: 100
      unit: percent
      verification: "CI and PR verification; the approver cannot be the implementer's agent"
    evidence: ["gate_status", "approval_missing", "ai_log_missing"]
    status: draft_from_plan
    supplied_by: "E+D"

  - id: NFR-08
    type: nonfunctional
    statement: "The offline suite is fully network-disabled and yields the same result across 3 consecutive runs in a clean environment; each experiment has input, code, model, prompt, rule and snapshot versions."
    priority: Must
    source: ["§3.3 NFR table", "FR-05"]
    tradeoff: null
    owner: E
    component: evaluation
    fit_criterion:
      metric: consecutive_identical_offline_runs
      operator: "eq"
      threshold: 3
      unit: count
      verification: "network blocking and manifest verification"
    evidence: ["manifest_mismatch", "event_gap"]
    status: draft_from_plan
    supplied_by: "E"

  - id: NFR-09
    type: nonfunctional
    statement: "Each phase emits run_id/phase/status/duration/reason; every paper-ledger change is linked to a risk_verdict and proposal hash; unknown cost must not be displayed as 0."
    priority: Must
    source: ["§3.3 NFR table", "FR-04", "INV-06"]
    tradeoff: null
    owner: "E+D"
    component: evaluation
    fit_criterion:
      metric: unknown_cost_shown_as_zero
      operator: "eq"
      threshold: 0
      unit: count
      verification: "event schema, completeness checks and failure tests"
    evidence: ["run_id", "risk_verdict", "proposal_hash", "event_gap"]
    status: draft_from_plan
    supplied_by: "E+D"

  - id: NFR-10
    type: nonfunctional
    statement: "After a requirement change, the corresponding rules, architecture and tests and trace are updated in the same sprint; no open Must remains at commit time."
    priority: Must
    source: ["§3.3 NFR table", "GATE-03"]
    tradeoff: null
    owner: A
    component: governance
    fit_criterion:
      metric: unclosed_must_requirements_at_commit
      operator: "eq"
      threshold: 0
      unit: count
      verification: "requirement diff check, review memo, release checklist (documented in docs/req/trace-FR-01-evidence.md, which maps test_offset_normalized_to_utc and test_naive_timestamp_not_assumed_utc to NFR-10)"
    evidence: ["docs/req/trace-FR-01-evidence.md", "docs/ai-use-log-A-fragment.yaml"]
    status: confirmed_by_owner
    supplied_by: "A"

  - id: INV-01
    type: invariant
    statement: "Any proposal that has not passed deterministic risk control must not change the paper ledger."
    priority: Must
    source: ["§4.4 invariant table", "FR-04"]
    tradeoff: "When audit or risk control is unavailable, sacrifice availability and refuse execution."
    owner: D
    component: risk_gate
    fit_criterion:
      metric: unauthorized_ledger_mutations
      operator: "eq"
      threshold: 0
      unit: count
      verification: "unapproved/forged verdict tests; on violation roll back the transaction, return BLOCKED and record a security event"
    evidence: ["T-INV-01", "risk_verdict", "ledger_commit"]
    status: draft_from_plan
    supplied_by: "D"

  - id: INV-02
    type: invariant
    statement: "Data published after the analysis as_of time is not used."
    priority: Must
    source: ["§4.4 invariant table", "FR-01"]
    tradeoff: "Exclude the data; if key evidence is insufficient, return REVIEW."
    owner: A
    component: evidence
    fit_criterion:
      metric: future_items_admitted
      operator: "eq"
      threshold: 0
      unit: count
      verification: "python -m pytest test/offline/evidence -q --tb=line (13 test functions over fixtures E-01..E-31; a date-only value is admitted only when its date is strictly earlier than the as_of UTC date, exact timestamp equality is admitted, a date-only/day value on the same UTC date is excluded with FUTURE_DATA and never INVALID_TIME)"
    evidence: ["E-01..E-31", "test_time_policy.py", "docs/approvals/test-hash-FR-01-evidence.txt"]
    status: confirmed_by_owner
    supplied_by: "A"

  - id: INV-03
    type: invariant
    statement: "Every external model call first obtains a budget reservation."
    priority: Must
    source: ["§4.4 invariant table", "FR-02"]
    tradeoff: "Refuse the call and terminate new inference."
    owner: B
    component: budget
    fit_criterion:
      metric: calls_without_reservation
      operator: "eq"
      threshold: 0
      unit: count
      verification: "concurrency and retry tests"
    evidence: ["T-BUD-01", "T-BUD-02"]
    status: draft_from_plan
    supplied_by: "B"

  - id: INV-04
    type: invariant
    statement: "The same proposal produces only one ledger change."
    priority: Must
    source: ["§4.4 invariant table", "FR-04"]
    tradeoff: "Return the already-committed result without double-charging."
    owner: D
    component: risk_gate
    fit_criterion:
      metric: duplicate_ledger_changes
      operator: "eq"
      threshold: 0
      unit: count
      verification: "restart/duplicate-request tests"
    evidence: ["T-RISK-02", "duplicate_prevented"]
    status: draft_from_plan
    supplied_by: "D"

  - id: INV-05
    type: invariant
    statement: "External text cannot change system rules or tool permissions."
    priority: Must
    source: ["§4.4 invariant table", "FR-03", "NFR-05"]
    tradeoff: "Isolate that evidence/response and record the rejection reason."
    owner: C
    component: deliberation
    fit_criterion:
      metric: external_text_rule_changes
      operator: "eq"
      threshold: 0
      unit: count
      verification: "injection and tool-privilege tests"
    evidence: ["malicious evidence set", "permission-denial"]
    status: draft_from_plan
    supplied_by: "C"

  - id: INV-06
    type: invariant
    statement: "Paper execution and its audit record are committed atomically."
    priority: Must
    source: ["§4.4 invariant table", "FR-04", "NFR-09"]
    tradeoff: "Roll back the whole transaction and stop execution."
    owner: D
    component: risk_gate
    fit_criterion:
      metric: non_atomic_ledger_audit_commits
      operator: "eq"
      threshold: 0
      unit: count
      verification: "disk-full/write-failure tests"
    evidence: ["T-RISK-03", "ledger_commit"]
    status: draft_from_plan
    supplied_by: "D"

  - id: INV-07
    type: invariant
    statement: "Secrets do not enter prompts, reports, commits or session exports."
    priority: Must
    source: ["§4.4 invariant table", "NFR-05"]
    tradeoff: "Block export/commit; if already leaked, revoke the key and record the incident."
    owner: D
    component: risk_gate
    fit_criterion:
      metric: secret_leaks
      operator: "eq"
      threshold: 0
      unit: count
      verification: "manual injection of a canary secret and scan"
    evidence: ["scan report"]
    status: draft_from_plan
    supplied_by: "D"

