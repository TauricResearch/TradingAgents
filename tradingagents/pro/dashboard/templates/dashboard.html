<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradingAgents Pro</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
         background:#0d1117; color:#c9d1d9; margin:0; padding:0.6rem 2rem 1rem; }
  header { display:flex; flex-wrap:wrap; gap:0.4rem 1.2rem; align-items:baseline;
           position:sticky; top:0; background:#0d1117; padding:0.5rem 0;
           border-bottom:1px solid #21262d; z-index:5; }
  h1 { font-size:1.05rem; color:#e6edf3; margin:0; }
  h2 { font-size:0.95rem; color:#79c0ff; border-bottom:1px solid #21262d;
       padding-bottom:4px; margin-top:1.4rem; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem 2rem; }
  @media (max-width: 900px) { .grid { grid-template-columns:1fr; } }
  .card { background:#161b22; border:1px solid #21262d; border-radius:8px;
          padding:0.8rem 1rem; overflow-x:auto; }
  .bull { color:#3fb950; } .bear { color:#f85149; } .neutral { color:#d29922; }
  table { border-collapse:collapse; width:100%; font-size:0.8rem; }
  td, th { border-bottom:1px solid #21262d; padding:3px 8px; text-align:left; }
  pre { white-space:pre-wrap; font-size:0.78rem; }
  .timeline li { margin-bottom:0.5rem; }
  small, .dim { color:#9ca7b3; font-size:0.875rem; }
  #conn { font-weight:bold; }
  #conn.live { color:#3fb950; } #conn.stale { color:#f85149; }
  .badge { border:1px solid #30363d; border-radius:12px; padding:1px 10px;
           font-size:0.8rem; background:#1c2128; }
  .decision { font-size:0.9rem; line-height:1.55; }
  .decision .action { font-size:1.5rem; font-weight:bold; }
  .ladder td { border:none; padding:1px 10px 1px 0; }
  details { margin-top:0.6rem; } details summary { cursor:pointer; color:#9ca7b3; }
</style>
</head>
<body>
<header>
  <h1>TradingAgents Pro</h1>
  <span id="conn" class="stale">CONNECTING…</span>
  <span class="dim" id="lastUpdate"></span>
  <span class="badge" id="regimeBadge">regime: —</span>
  <span class="badge" id="execBadge">exec: —</span>
  <span class="badge" id="priceBadge">—</span>
</header>
<div class="grid">
  <div class="card"><h2>Decision</h2><div class="decision" id="recommendation">loading…</div></div>
  <div class="card"><h2>Market overview</h2><pre id="overview">loading…</pre></div>
  <div class="card" style="grid-column:1/-1"><h2>Debate timeline</h2>
    <ul class="timeline" id="timeline"></ul></div>
  <div class="card"><h2>Evidence panels</h2><div id="evidence"></div></div>
  <div class="card"><h2>Agent performance <small>(by hit rate)</small></h2><div id="agents"></div></div>
  <div class="card"><h2>Trade journal</h2><div id="journal"></div></div>
  <div class="card"><h2>Backtest</h2><pre id="backtest">loading…</pre></div>
  <div class="card"><h2>Memory insights</h2><pre id="memory">loading…</pre></div>
</div>
<script>
// --- auth (SEC-UI-01): token kept in sessionStorage, sent on every call ----
function apiHeaders() {
  const token = sessionStorage.getItem("proToken");
  return token ? {"X-API-Key": token} : {};
}
async function fetchJson(url) {
  const response = await fetch(url, {headers: apiHeaders()});
  if (response.status === 401) {
    const token = prompt("Dashboard API token (X-API-Key):");
    if (token) {
      sessionStorage.setItem("proToken", token);
      return fetchJson(url);
    }
    throw new Error("unauthorized");
  }
  if (!response.ok) throw new Error(`HTTP ${response.status} for ${url}`);
  return response.json();
}

// --- staleness (ALERT-01): per-panel guard + LIVE/STALE indicator ----------
let lastSuccess = 0;
const previous = {};   // panel -> last content hash (PERF-01)
function setPanel(id, html) {
  if (previous[id] === html) return;      // skip untouched DOM (PERF-01)
  previous[id] = html;
  document.getElementById(id).innerHTML = html;
}
async function renderSafe(name, fn) {
  try { await fn(); lastSuccess = Date.now(); }
  catch (err) { console.warn(`panel ${name} failed:`, err.message); }
}
setInterval(() => {
  const conn = document.getElementById("conn");
  const age = (Date.now() - lastSuccess) / 1000;
  if (!lastSuccess || age > 12) {
    conn.textContent = lastSuccess ? `STALE ${Math.round(age)}s` : "DISCONNECTED";
    conn.className = "stale";
  } else {
    conn.textContent = "LIVE";
    conn.className = "live";
    document.getElementById("lastUpdate").textContent =
      "updated " + new Date(lastSuccess).toLocaleTimeString();
  }
}, 1000);

// --- colorblind-safe direction encoding (A11Y-01) ---------------------------
function dirGlyph(value) {
  if (["bull", "bullish", "BUY"].includes(value)) return "▲";
  if (["bear", "bearish", "SELL"].includes(value)) return "▼";
  return "–";
}
function stanceClass(value) {
  if (["bull", "bullish", "BUY"].includes(value)) return "bull";
  if (["bear", "bearish", "SELL"].includes(value)) return "bear";
  return "neutral";
}
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// --- decision card (EXPL-01 light / EXPL-02 / IA-02) ------------------------
function renderDecision(rec) {
  if (rec.status) return esc(rec.status);
  const cls = stanceClass(rec.action), glyph = dirGlyph(rec.action);
  let html = `<span class="action ${cls}">${glyph} ${esc(rec.action)}</span>` +
    ` <span class="dim">confidence ${rec.confidence}/100 · regime ${esc(rec.market_regime)}</span><br>`;
  if (rec.entry_price != null) {
    const pct = p => ((p / rec.entry_price - 1) * 100).toFixed(1);
    const rows = [];
    [...rec.take_profits].reverse().forEach((tp, i) =>
      rows.push(`<tr><td>TP${rec.take_profits.length - i}</td><td>${tp.price}</td>` +
                `<td class="dim">${pct(tp.price) > 0 ? "+" : ""}${pct(tp.price)}% · closes ${tp.size_fraction * 100}%</td></tr>`));
    rows.push(`<tr><td><b>ENTRY</b></td><td><b>${rec.entry_price}</b></td><td></td></tr>`);
    rows.push(`<tr><td>STOP</td><td>${rec.stop_loss}</td>` +
              `<td class="dim">${pct(rec.stop_loss)}% · R:R ${rec.risk_reward ?? "—"}</td></tr>`);
    html += `<table class="ladder">${rows.join("")}</table>`;
    html += `size: ${Number(rec.position_size.quantity).toFixed(4)} units` +
            ` (${rec.position_size.pct_of_equity ?? "—"}% equity)<br>`;
  } else {
    html += `<span class="dim">no levels — not a directional position</span><br>`;
  }
  const tally = rec.vote_tally || {};
  html += `votes: <span class="bull">▲${tally.BUY ?? 0}</span> ` +
          `<span class="neutral">–${tally.HOLD ?? 0}</span> ` +
          `<span class="bear">▼${tally.SELL ?? 0}</span>` +
          ` <span class="dim">(${rec.n_evidence} evidence, ${rec.n_counterarguments} counter)</span><br>`;
  if (rec.invalidation)
    html += `<b>invalidation:</b> ${esc(rec.invalidation)}<br>`;
  // plumbing fields hidden behind the expander (IA-02)
  const {schema_version, id, created_at, ...visible} = rec;
  html += `<details><summary>full schema (JSON)</summary>` +
          `<pre>${esc(JSON.stringify(visible, null, 1))}</pre></details>`;
  return html;
}

async function refresh() {
  await renderSafe("overview", async () => {
    const overview = await fetchJson("/api/overview");
    setPanel("overview", esc(JSON.stringify(overview, null, 1)));
    document.getElementById("regimeBadge").textContent = "regime: " + (overview.regime ?? "—");
    document.getElementById("execBadge").textContent = "exec: " + (overview.execution_status ?? overview.rejected_at ?? "—");
    document.getElementById("priceBadge").textContent =
      (overview.symbol ?? "—") + " " + (overview.last_close ?? "");
  });
  await renderSafe("recommendation", async () => {
    setPanel("recommendation", renderDecision(await fetchJson("/api/recommendation/latest")));
  });
  await renderSafe("backtest", async () => {
    setPanel("backtest", esc(JSON.stringify(await fetchJson("/api/backtest"), null, 1)));
  });
  await renderSafe("memory", async () => {
    setPanel("memory", esc(JSON.stringify(await fetchJson("/api/memory"), null, 1)));
  });
  await renderSafe("runs", async () => {
    const runs = await fetchJson("/api/runs");
    if (!runs.length) return;
    const latest = runs[runs.length - 1];
    const timeline = await fetchJson(`/api/runs/${latest.run_id}/timeline`);
    setPanel("timeline", timeline.entries.map(entry =>
      `<li><b class="${stanceClass(entry.stance)}">${dirGlyph(entry.stance)} ${esc(entry.speaker)}</b>` +
      ` <small>(${esc(entry.stance ?? "")}, conf ${entry.confidence ?? "-"})</small><br>` +
      `${esc(entry.argument)}` +
      (entry.cited.length ? `<br><small>cites: ${esc(entry.cited.join(", "))}</small>` : "") +
      `</li>`).join(""));
    const evidence = await fetchJson(`/api/runs/${latest.run_id}/evidence`);
    setPanel("evidence", Object.entries(evidence).map(
      ([team, items]) => `<h3>${esc(team)} (${items.length})</h3>` + items.map(e =>
        `<div><b class="${stanceClass(e.direction)}">${dirGlyph(e.direction)} ${esc(e.agent_id)}</b>` +
        ` <small>${esc(e.direction)} ${e.confidence}</small>: ${esc(e.claim)}</div>`).join("")
    ).join(""));
  });
  await renderSafe("agents", async () => {
    const agents = await fetchJson("/api/agents");
    const rows = Object.entries(agents).sort((a, b) =>       // NAV-02
      (b[1].hit_rate ?? -1) - (a[1].hit_rate ?? -1) || b[1].votes - a[1].votes);
    setPanel("agents",
      "<table><tr><th>agent</th><th>votes</th><th>avg conf</th><th>hit rate</th></tr>" +
      rows.map(([id, row]) =>
        `<tr><td>${esc(id)}</td><td>${row.votes}</td>` +
        `<td>${row.avg_confidence.toFixed(0)}</td>` +
        `<td>${row.hit_rate === null ? "—" : (row.hit_rate * 100).toFixed(0) + "%"}</td></tr>`
      ).join("") + "</table>");
  });
  await renderSafe("journal", async () => {
    const journal = await fetchJson("/api/journal");
    setPanel("journal",
      `<p>trades: ${journal.n_trades} · total P&L: ${journal.total_pnl.toFixed(2)}` +
      (journal.win_rate !== null ? ` · win rate ${(journal.win_rate * 100).toFixed(0)}%` : "") +
      "</p><table><tr><th>symbol</th><th>action</th><th>pnl</th><th>closed</th></tr>" +
      journal.entries.map(entry =>
        `<tr><td>${esc(entry.symbol)}</td>` +
        `<td class="${stanceClass(entry.action)}">${dirGlyph(entry.action)} ${esc(entry.action)}</td>` +
        `<td class="${entry.pnl >= 0 ? "bull" : "bear"}">${entry.pnl >= 0 ? "+" : ""}${entry.pnl.toFixed(2)}</td>` +
        `<td><small>${esc(entry.closed_at)}</small></td></tr>`).join("") + "</table>");
  });
}
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 5000);   // PERF-01
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
