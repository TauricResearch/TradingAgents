# Local Pro stack: dashboard + (optional) Qdrant for memory retrieval.
#   docker compose -f deploy/docker-compose.pro.yml up
#   docker compose -f deploy/docker-compose.pro.yml --profile qdrant up
services:
  pro-dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.pro
    ports:
      - "127.0.0.1:8600:8600"  # loopback only; front with a reverse proxy to expose
    environment:
      FRED_API_KEY: ${FRED_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TRADINGAGENTS_LLM_PROVIDER: ${TRADINGAGENTS_LLM_PROVIDER:-deepseek}
      TRADINGAGENTS_QUICK_THINK_LLM: ${TRADINGAGENTS_QUICK_THINK_LLM:-deepseek-chat}
      TRADINGAGENTS_DEEP_THINK_LLM: ${TRADINGAGENTS_DEEP_THINK_LLM:-deepseek-chat}
      PRO_LOOP_INTERVAL_SECONDS: ${PRO_LOOP_INTERVAL_SECONDS:-3600}
      PRO_LOOP_DISABLED: ${PRO_LOOP_DISABLED:-}
      TRADINGAGENTS_PRO_DATA: /data
      OANDA_API_TOKEN: ${OANDA_API_TOKEN:-}
      OANDA_ENV: ${OANDA_ENV:-practice}
      # Empty = auth DISABLED (dev/testing; the port binds loopback only).
      # Production: export PRO_DASHBOARD_TOKEN before `compose up`.
      PRO_DASHBOARD_TOKEN: ${PRO_DASHBOARD_TOKEN:-}
    volumes:
      - pro-data:/data
    # `always`, not `unless-stopped`: Docker Desktop stops containers
    # gracefully on quit, which `unless-stopped` treats as a manual stop —
    # the soak loop would silently stay down at next login.
    restart: always

  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  pro-data:
  qdrant-data:
