services:
  tradingagents:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_STORAGE_BACKEND=sqlite
      - TRADINGAGENTS_SQLITE_PATH=/home/appuser/.tradingagents/tradingagents.db
      - TRADINGAGENTS_USER_ID=admin
      - TRADINGAGENTS_ACTOR_USER_ID=admin
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  crypto-dashboard:
    build: .
    entrypoint: ["python"]
    command: ["scripts/crypto_dashboard.py", "--host", "0.0.0.0", "--port", "8765", "--no-open"]
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_STORAGE_BACKEND=sqlite
      - TRADINGAGENTS_SQLITE_PATH=/home/appuser/.tradingagents/tradingagents.db
      - TRADINGAGENTS_USER_ID=admin
      - TRADINGAGENTS_ACTOR_USER_ID=admin
    ports:
      - "8765:8765"
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
      - TRADINGAGENTS_STORAGE_BACKEND=sqlite
      - TRADINGAGENTS_SQLITE_PATH=/home/appuser/.tradingagents/tradingagents.db
      - TRADINGAGENTS_USER_ID=admin
      - TRADINGAGENTS_ACTOR_USER_ID=admin
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
