# Outcome-blind formal decision worker. This app must receive only the
# paper-decision PostgreSQL URL and the model-provider secret. It is deployed
# paused and becomes runnable only after durable release authorization exists.
app = "tradagent-paper-decision"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.paper"

[processes]
  app = "decision-daemon"

[env]
  MEDIA_AUTO_MIGRATE = "false"
  PAPER_AUTO_MIGRATE = "false"
  PAPER_RUN_ID = "global-event-v2-confirmatory-001"
  PAPER_ENGINE = "formal-global-v2"
  PAPER_DECISIONS_ENABLED = "false"
  PAPER_TICKERS = "AAPL,MSFT,NVDA,AMZN,GOOGL,META,JPM,BRK-B,XOM,CVX,LLY,UNH,WMT,HD,PG,CAT,GE,NEE,BA,LIN"
  PAPER_BENCHMARK = "SPY"
  PAPER_ANALYSTS = "news"
  PAPER_GLOBAL_TOPICS_ONLY = "true"
  MEDIA_POLLER_INTERVAL = "3600"
  PAPER_LLM_MODEL_ALLOWLIST = "openai:gpt-5.4-mini,openai:gpt-5.4-mini-2026-03-17"
  PAPER_LLM_MAX_CALLS_PER_DECISION = "3"
  PAPER_LLM_MAX_CALLS_PER_UTC_DAY = "3"
  PAPER_LLM_MAX_PROMPT_BYTES = "160000"
  PAPER_LLM_MAX_COMPLETION_TOKENS = "8000"
  PAPER_LLM_TIMEOUT_SECONDS = "180"
  TRADINGAGENTS_OPENAI_REASONING_EFFORT = "low"
  TRADINGAGENTS_LLM_MAX_RETRIES = "0"
  PAPER_RETRY_ATTEMPTS = "3"
  PAPER_RETRY_SECONDS = "300"
  PAPER_REPLICATES = "1"
  PAPER_PORTFOLIO_MODE = "long-only"
  PAPER_TRADING_COST_BPS = "5"
  PAPER_SLIPPAGE_BPS = "5"
  PAPER_ANNUAL_BORROW_BPS = "0"

[[restart]]
  policy = "on-failure"
  max_retries = 10

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
