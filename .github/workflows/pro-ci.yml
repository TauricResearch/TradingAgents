# CI for the TradingAgents Pro extension. The base repo's ci.yml continues
# to cover the stock workflow; this workflow adds the Pro gates.
name: pro-ci

on:
  push:
    branches: ["pro/**", "main"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (locked)
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Lint (ruff)
        run: ruff check .
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock
      - name: Full test suite
        run: pytest -q
      - name: Decision evals (structural gate always; model gate needs a key)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest -q tests/test_pro_evals.py
          if [ -n "$OPENAI_API_KEY" ]; then python -m tradingagents.pro.evals; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle budget (initial JS < 200 KB gzip)
        run: |
          size=$(gzip -c ../tradingagents/pro/dashboard/static/assets/index-*.js | wc -c)
          echo "initial bundle: ${size} bytes gzip"
          test "$size" -lt 204800
      - uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: tradingagents/pro/dashboard/static/

  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend (locked)
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: tradingagents/pro/dashboard/static/
      - name: Install frontend + browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright E2E
        working-directory: frontend
        env:
          PRO_PYTHON: python
        run: npx playwright test --project=desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/

  docker-build:
    needs: [lint-and-test, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Pro image
        run: docker build -f deploy/Dockerfile.pro -t tradingagents-pro:${{ github.sha }} .
