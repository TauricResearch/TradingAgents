# CI for the TradingAgents Pro extension. The base repo's ci.yml continues
# to cover the stock workflow; this workflow adds the Pro gates.
name: pro-ci

on:
  push:
    branches: ["pro/**", "main"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (locked)
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Lint (ruff)
        run: ruff check .
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock
      - name: Full test suite
        run: pytest -q
      - name: Decision evals (structural gate always; model gate needs a key)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest -q tests/test_pro_evals.py
          if [ -n "$OPENAI_API_KEY" ]; then python -m tradingagents.pro.evals; fi

  docker-build:
    needs: lint-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Pro image
        run: docker build -f deploy/Dockerfile.pro -t tradingagents-pro:${{ github.sha }} .
