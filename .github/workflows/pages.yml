name: Site

on:
  push:
    branches: [main]
    paths: [README.md, .github/site/**, .github/workflows/pages.yml]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    environment: readme-translation
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: de, language: German }
          - { lang: es, language: Spanish }
          - { lang: fr, language: French }
          - { lang: ja, language: Japanese }
          - { lang: ko, language: Korean }
          - { lang: pt, language: Portuguese }
          - { lang: ru, language: Russian }
          - { lang: zh, language: Simplified Chinese }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          COPILOT_CLI_VERSION: 1.0.105
        run: npm install -g "@github/copilot@$COPILOT_CLI_VERSION"
      - id: ai
        # A failed translation leaves the published site unchanged.
        continue-on-error: true
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        with:
          prompt-file: .github/site/translate.prompt.yml
          input: "language: ${{ matrix.language }}"
          file_input: "readme: README.md"
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      - if: steps.ai.outcome == 'success'
        env:
          RESPONSE: ${{ steps.ai.outputs.response-file }}
        run: mkdir -p translations && cp "$RESPONSE" "translations/${{ matrix.lang }}.md"
      - if: steps.ai.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: translation-${{ matrix.lang }}
          path: translations/
          retention-days: 1

  build:
    needs: translate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      complete: ${{ steps.build.outputs.complete }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: translation-*
          path: translations
          merge-multiple: true
      - id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/site/build.py _site translations de es fr ja ko pt ru zh
      - if: steps.build.outputs.complete == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    if: needs.build.outputs.complete == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
