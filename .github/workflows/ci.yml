name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (results/ and worklog/ are excluded via pyproject extend-exclude).
        run: ruff check .

  postgres-contracts:
    name: PostgreSQL 16 migration and release contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          python -m pip install --upgrade pip
          pip install -e ".[dev,poller]"
      - name: Replay exact migration heads and run PostgreSQL contracts
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PG_SUPERUSER: postgres
          MEDIA_AUTO_MIGRATE: "false"
          PAPER_AUTO_MIGRATE: "false"
        run: |
          set -euo pipefail
          driver_base="postgresql+psycopg://"
          host="${PGHOST}:${PGPORT}"

          bash scripts/prepare_postgres_rehearsal.sh ta_price_head008 8
          TRADINGAGENTS_TEST_POSTGRES_ADMIN_URL="${driver_base}tradingagents-app-v2@${host}/ta_price_head008" \
          TRADINGAGENTS_TEST_POSTGRES_PAPER_URL="${driver_base}tradingagents-paper@${host}/ta_price_head008" \
            pytest -q -m integration tests/test_formal_price_capture_migration.py

          bash scripts/prepare_postgres_rehearsal.sh ta_time_head009 9
          TRADINGAGENTS_TEST_POSTGRES_URL="${driver_base}tradingagents-ingest-v2@${host}/ta_time_head009" \
            pytest -q -m integration tests/test_server_observed_evidence_migration.py

          bash scripts/prepare_postgres_rehearsal.sh ta_governance_head010 10
          TRADINGAGENTS_TEST_POSTGRES_GOVERNANCE_URL="${driver_base}tradingagents-app-v2@${host}/ta_governance_head010" \
            pytest -q -m integration tests/test_formal_artifact_governance_migration.py

          bash scripts/prepare_postgres_rehearsal.sh ta_authorization_head012 12
          TRADINGAGENTS_TEST_POSTGRES_ADMIN_URL="${driver_base}tradingagents-app-v2@${host}/ta_authorization_head012" \
            pytest -q -m integration tests/test_formal_release_authorization_migration.py

          bash scripts/prepare_postgres_rehearsal.sh ta_llm_head013 13
          TRADINGAGENTS_TEST_POSTGRES_ADMIN_URL="${driver_base}tradingagents-app-v2@${host}/ta_llm_head013" \
            pytest -q -m integration tests/test_formal_llm_budget_migration.py

          bash scripts/prepare_postgres_rehearsal.sh ta_roles_head013 13
          TRADINGAGENTS_TEST_POSTGRES_ADMIN_URL="${driver_base}tradingagents-app-v2@${host}/ta_roles_head013" \
          TRADINGAGENTS_TEST_POSTGRES_FIXTURE_URL="${driver_base}postgres@${host}/ta_roles_head013" \
            pytest -q -m integration tests/test_formal_role_split.py

          if [[ -f tests/test_formal_release_postgres.py ]]; then
            bash scripts/prepare_postgres_rehearsal.sh ta_release_head013 13
            TRADINGAGENTS_TEST_POSTGRES_RELEASE_URL="${driver_base}tradingagents-app-v2@${host}/ta_release_head013" \
              pytest -q -m integration tests/test_formal_release_postgres.py
          fi
