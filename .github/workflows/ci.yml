name: CI

on:
  push:
    # `custom` is this repository's integration branch (AGENTS.md §3), so a
    # push to it must be validated too — otherwise a merge lands unverified.
    # `main` is the upstream default branch and stays listed.
    branches: [main, custom, 'v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }}${{ matrix.tz && format(', {0}', matrix.tz) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # One run away from UTC, so a test that only passes in UTC fails here.
        include:
          - python-version: "3.12"
            tz: America/New_York
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev and web extras)
        # The suite imports the web console (tests/test_webapp.py,
        # tests/test_usage.py), which needs fastapi/uvicorn from the `web`
        # extra. Installing only `dev` made the tests job fail on collection
        # on every Python version, so it could never be a required check.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.16"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (generated results/ is excluded via pyproject extend-exclude).
        run: ruff check .

  reliability-regression:
    name: P0 reliability regression (offline)
    runs-on: ubuntu-latest
    # The P0 gates are the merge gate: a regression here must fail the PR.
    # These suites are offline by construction — no network, no LLM, no
    # SEC credentials, no broker — so they are safe to run on every PR.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the P0 regression suites
        # Only files that exist on this branch: passing a missing path makes
        # pytest exit non-zero for the wrong reason.
        run: |
          pytest -q \
            tests/test_p0_final_hardening.py \
            tests/test_p0_paper_safety.py \
            tests/test_p0_completion.py \
            tests/test_p0_auto_wiring.py \
            tests/test_p0_harvest_wiring.py \
            tests/test_p0_sizing_wiring.py \
            tests/test_reliability_baseline.py \
            tests/test_execution_gate.py \
            tests/test_gate_integration.py \
            tests/test_risk_engine.py \
            tests/test_fact_checker.py \
            tests/test_causal_guard.py \
            tests/test_data_validator.py \
            tests/test_audit.py \
            tests/test_financial_math_engine.py \
            tests/test_math_gate_end_to_end.py \
            tests/test_deterministic_math.py \
            tests/test_metric_definitions.py \
            tests/test_report_validation.py \
            tests/test_p0_1924_regression.py \
            tests/test_trade_actions.py \
            tests/test_sec_reconciliation.py \
            tests/test_execution_chokepoint.py \
            tests/test_determinism.py \
            tests/test_p0_numbered_cases.py \
            tests/test_exchange_calendar.py
