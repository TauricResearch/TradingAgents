name: Secret Scan

on:
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-secrets:
    name: detect-secrets vs baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0
      - name: Scan and fail on new secrets outside baseline
        run: |
          set -euo pipefail
          detect-secrets scan > /tmp/current.json
          python3 - <<'EOF'
          import json, sys
          committed = json.load(open('.secrets.baseline'))['results']
          current = json.load(open('/tmp/current.json'))['results']
          new_findings = []
          for f, secrets in current.items():
              baseline_hashes = {s['hashed_secret'] for s in committed.get(f, [])}
              for s in secrets:
                  if s['hashed_secret'] not in baseline_hashes:
                      new_findings.append(f'{f}:{s["line_number"]} ({s["type"]})')
          if new_findings:
              print('::error::New secrets detected outside baseline!')
              for x in new_findings:
                  print('  -', x)
              sys.exit(1)
          print('No new secrets - OK')
          EOF
