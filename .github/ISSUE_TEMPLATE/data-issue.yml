name: Data issue
description: A figure, price, date or company in an answer is wrong or missing.
labels: [bug, data]
body:
  - type: input
    id: symbol
    attributes:
      label: Symbol or series
      description: The ticker, instrument or economic series, such as `AAPL` or US CPI.
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: What the answer said
      description: The question, the figure or statement as written, and the date you asked.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: The source it cited
      description: The line in the sources list for the figure's number, such as `[2]`.
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What is right
      description: The correct figure or fact, with a source for it.
    validations:
      required: true
