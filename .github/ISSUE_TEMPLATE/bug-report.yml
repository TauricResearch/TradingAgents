name: Bug report
description: TradingAgents fails, crashes or does something other than it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `tradingagents --version`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options:
        - Install script
        - npm
        - Release file
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (x64)
        - Linux (arm64)
        - macOS (Intel)
        - macOS (Apple silicon)
        - Other
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Tauric
        - ChatGPT plan
        - OpenAI
        - Anthropic
        - Google
        - DeepSeek
        - OpenRouter
        - LLMTR
        - OpenAI-compatible server
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: Its `provider/id`, such as `anthropic/claude-opus-5-5`.
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: The command or question, and the steps that lead to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The message or output, as shown.
    validations:
      required: true
  - type: textarea
    id: transcript
    attributes:
      label: Transcript or output
      description: Optional. The transcript from `/export md`, or an excerpt of the output. Remove keys and anything private first.
      render: markdown
