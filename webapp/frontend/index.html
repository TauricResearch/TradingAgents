<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TradingAgents — AI Stock Research</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
  h1 { font-size: 1.4rem; }
  section { margin-bottom: 32px; padding: 16px; border: 1px solid #8884; border-radius: 8px; }
  input, button, select { font-size: 1rem; padding: 8px; margin: 4px 0; }
  input[type=text], input[type=email] { width: 100%; box-sizing: border-box; }
  button { cursor: pointer; }
  pre { white-space: pre-wrap; background: #8881; padding: 12px; border-radius: 6px; }
  .muted { opacity: .7; font-size: .9rem; }
  .warn { color: #b45309; font-size: .85rem; }
</style>
</head>
<body>
  <h1>TradingAgents — AI Multi-Agent Stock Research</h1>
  <p class="muted">
    Research reports generated by a team of LLM analyst/researcher/risk agents.
    Not financial advice; for research purposes only.
  </p>

  <section id="signup-section">
    <h2>1. Get an API key</h2>
    <input id="email" type="email" placeholder="you@example.com" />
    <button onclick="signup()">Sign up (free tier)</button>
    <p id="signup-result" class="muted"></p>
  </section>

  <section id="account-section">
    <h2>Account</h2>
    <input id="api-key" type="text" placeholder="Paste your API key" />
    <button onclick="loadAccount()">Load account</button>
    <button onclick="upgrade()">Upgrade to Pro</button>
    <pre id="account-info"></pre>
  </section>

  <section id="analyze-section">
    <h2>2. Run an analysis</h2>
    <input id="ticker" type="text" placeholder="e.g. NVDA" />
    <input id="trade-date" type="text" placeholder="YYYY-MM-DD (optional, defaults to today)" />
    <button onclick="runAnalysis()">Analyze</button>
    <p id="analyze-status" class="muted"></p>
    <pre id="analyze-result"></pre>
  </section>

  <script>
    function apiKey() { return document.getElementById('api-key').value.trim(); }

    async function signup() {
      const email = document.getElementById('email').value.trim();
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      const out = document.getElementById('signup-result');
      if (!res.ok) { out.textContent = 'Error: ' + (data.detail || res.status); return; }
      out.textContent = 'API key: ' + data.api_key + ' (save this, it will not be shown again)';
      document.getElementById('api-key').value = data.api_key;
    }

    async function loadAccount() {
      const res = await fetch('/api/me', { headers: { 'X-API-Key': apiKey() } });
      const data = await res.json();
      document.getElementById('account-info').textContent = JSON.stringify(data, null, 2);
    }

    async function upgrade() {
      const res = await fetch('/api/billing/checkout', {
        method: 'POST',
        headers: { 'X-API-Key': apiKey() },
      });
      const data = await res.json();
      if (!res.ok) { alert(data.detail || 'Billing not available'); return; }
      window.location.href = data.checkout_url;
    }

    async function runAnalysis() {
      const ticker = document.getElementById('ticker').value.trim();
      const trade_date = document.getElementById('trade-date').value.trim() || null;
      const status = document.getElementById('analyze-status');
      const result = document.getElementById('analyze-result');
      result.textContent = '';
      status.textContent = 'Submitting...';

      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey() },
        body: JSON.stringify({ ticker, trade_date }),
      });
      const data = await res.json();
      if (!res.ok) { status.textContent = 'Error: ' + (data.detail || res.status); return; }

      status.textContent = 'Running (this can take a few minutes)...';
      poll(data.job_id, status, result);
    }

    async function poll(jobId, status, result) {
      const res = await fetch('/api/jobs/' + jobId, { headers: { 'X-API-Key': apiKey() } });
      const job = await res.json();
      if (job.status === 'queued' || job.status === 'running') {
        status.textContent = 'Status: ' + job.status + '...';
        setTimeout(() => poll(jobId, status, result), 5000);
        return;
      }
      if (job.status === 'failed') {
        status.textContent = 'Failed: ' + job.error;
        return;
      }
      status.textContent = 'Done.';
      result.textContent = 'Decision: ' + job.decision + '\n\n' + (job.report || '');
    }
  </script>
</body>
</html>
