# RETIRED combined paper worker. Do not deploy this configuration for the
# formal trial. Use fly.paper.decision.toml and fly.paper.marker.toml with their
# distinct least-privilege database identities. This file remains only for an
# explicit, paused legacy rollback audit.
app = "tradagent-paper"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.paper"

[env]
  # Production schema changes are applied by the separate admin identity while
  # both runtimes are paused; neither worker may migrate during startup.
  MEDIA_AUTO_MIGRATE = "false"
  PAPER_AUTO_MIGRATE = "false"
  PAPER_RUN_ID = "global-event-v2-confirmatory-001"
  PAPER_ENGINE = "formal-global-v2"
  # Fail closed after deployment. Enable only after collector receipts,
  # DB restore, staging replay, and least-privilege checks pass.
  PAPER_DECISIONS_ENABLED = "false"
  PAPER_MARKS_ENABLED = "false"
  PAPER_TICKERS = "AAPL,MSFT,NVDA,AMZN,GOOGL,META,JPM,BRK-B,XOM,CVX,LLY,UNH,WMT,HD,PG,CAT,GE,NEE,BA,LIN"
  PAPER_BENCHMARK = "SPY"
  PAPER_ANALYSTS = "news"
  PAPER_GLOBAL_TOPICS_ONLY = "true"
  # Mirrors the collector cadence used by the formal cutoff-cycle receipt gate.
  MEDIA_POLLER_INTERVAL = "3600"
  # Both requested and provider-returned model identities must be explicit.
  # Formal call reservations persist in the append-only governed budget ledger.
  PAPER_LLM_MODEL_ALLOWLIST = "openai:gpt-5.4-mini,openai:gpt-5.4-mini-2026-03-17"
  PAPER_LLM_MAX_CALLS_PER_DECISION = "3"
  PAPER_LLM_MAX_CALLS_PER_UTC_DAY = "3"
  PAPER_LLM_MAX_PROMPT_BYTES = "160000"
  PAPER_LLM_MAX_COMPLETION_TOKENS = "8000"
  PAPER_LLM_TIMEOUT_SECONDS = "180"
  TRADINGAGENTS_OPENAI_REASONING_EFFORT = "low"
  TRADINGAGENTS_LLM_MAX_RETRIES = "0"
  # Outer retries apply only before any model reservation. After a reservation,
  # the same decision is never retried; a failed decision becomes an ITT
  # carry-forward interval. Durable counters survive deploys and crash loops.
  PAPER_RETRY_ATTEMPTS = "3"
  PAPER_RETRY_SECONDS = "300"
  PAPER_REPLICATES = "1"
  PAPER_PORTFOLIO_MODE = "long-only"

[[restart]]
  policy = "on-failure"
  max_retries = 10

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
